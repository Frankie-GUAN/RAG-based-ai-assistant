services:
  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ragagent123}
      MYSQL_DATABASE: rag_agent
      ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: rag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 此前这里传的是 GEMINI_API_KEY，而 config.py 读DEEPSEEK_API_KEY ——
      # compose 起的后端拿不到任何 LLM key，每次问答都会失败。
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # 此前没有透传，联网搜索在 compose 环境下恒为关闭。
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - PRELOAD_MODELS=${PRELOAD_MODELS:-true}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-ragagent123}
      - MYSQL_DATABASE=rag_agent
    volumes:
      - ./data:/app/data
      # 模型缓存：BGE-M3 约 2GB、精排模型再约 2GB。不挂出来的话，每次重建容器
      # 都要重新下载一遍——而容器里未必有可用的 CA 证书（见 requirements.txt 里
      # certifi 的注释），于是变成「每次 build 都要手动把模型搬进去」。
      - hf-cache:/root/.cache/huggingface
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  hf-cache: